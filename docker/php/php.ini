; Production overrides (loaded after php.ini defaults, applies to FPM and CLI)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = 256M
; Inline "Cek Judol" runs inside a web request (AI budget 120s + crawl)
max_execution_time = 300
max_input_time = 60
upload_max_filesize = 12M
post_max_size = 16M


opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code is immutable inside the image
opcache.validate_timestamps = 0
opcache.jit = off
