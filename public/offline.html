<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak ada koneksi</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/pwa/icon-192.png">
    <!--
        Served by the service worker when a page is opened with no network, so it
        cannot depend on the Vite build or on Google Fonts - everything it needs is
        inline, and the font stack falls back to the system UI face.
    -->
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fafafa;
            --card: #ffffff;
            --border: #e4e4e7;
            --text: #18181b;
            --muted: #71717a;
            --accent: #132b50;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #09090b;
                --card: #18181b;
                --border: #27272a;
                --text: #f4f4f5;
                --muted: #a1a1aa;
                --accent: #6e96d4;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bg);
            color: var(--text);
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 26rem;
            padding: 2rem;
            border: 1px solid var(--border);
            border-radius: 1rem;
            background: var(--card);
            text-align: center;
        }

        .mark {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1.25rem;
            border-radius: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #132b50;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0;
            font-size: 0.875rem;
            line-height: 1.6;
            color: var(--muted);
        }

        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.625rem 1rem;
            border: 0;
            border-radius: 0.5rem;
            background: var(--accent);
            color: #ffffff;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }

        .status {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z" />
                <path d="M8.5 12.2l2.4 2.4 4.6-4.9" />
            </svg>
        </div>
        <h1>Tidak ada koneksi</h1>
        <p>Halaman ini butuh koneksi internet. Periksa jaringan Anda, lalu coba muat ulang.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
        <p class="status" id="status">Menunggu koneksi kembali...</p>
    </main>

    <script>
        // Reloads by itself the moment the network comes back, so nobody has to sit
        // and tap the button.
        addEventListener('online', () => location.reload());

        if (navigator.onLine) {
            document.getElementById('status').textContent = 'Koneksi terdeteksi - server mungkin sedang tidak dapat dihubungi.';
        }
    </script>
</body>
</html>
