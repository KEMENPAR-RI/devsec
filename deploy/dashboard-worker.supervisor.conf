; Queue worker for the monitoring dashboard (supervisor).
;
; Use this when the server runs supervisor rather than systemd - typical on
; cPanel/Plesk boxes. See deploy/dashboard-worker.service for the systemd form;
; install only one of the two, never both, or every job runs twice.
;
; Install:
;   sudo cp deploy/dashboard-worker.supervisor.conf /etc/supervisor/conf.d/dashboard-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status dashboard-worker:*
;
; Adjust the paths and user to match the server.

[program:dashboard-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dashboard/artisan queue:work --queue=default --sleep=3 --tries=1 --timeout=300 --max-time=3600
directory=/var/www/dashboard
autostart=true
autorestart=true
user=www-data

; One worker is enough for 22 sites and avoids several crawls hammering the same
; host at once. Raise it only if the queue is genuinely falling behind.
numprocs=1

; Above the longest job's timeout, so a crawl in progress is allowed to finish
; when supervisor stops the worker.
stopwaitsecs=330
stopasgroup=true
killasgroup=true

redirect_stderr=true
stdout_logfile=/var/www/dashboard/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
