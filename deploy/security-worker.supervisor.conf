; Queue worker for the monitoring security (supervisor).
;
; Use this when the server runs supervisor rather than systemd - typical on
; cPanel/Plesk boxes. See deploy/security-worker.service for the systemd form;
; install only one of the two, never both, or every job runs twice.
;
; Install:
;   sudo cp deploy/security-worker.supervisor.conf /etc/supervisor/conf.d/security-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status security-worker:*
;
; Adjust the paths and user to match the server.

[program:security-worker]

process_name=%(program_name)s_%(process_num)02d

command=/usr/bin/php artisan queue:work --queue=default --sleep=3 --tries=1 --timeout=300 --max-time=3600

directory=/www/wwwroot/deadsec.apiprs.my.id

autostart=true
autorestart=true

user=www

numprocs=1

stopwaitsecs=330
stopasgroup=true
killasgroup=true

redirect_stderr=true

stdout_logfile=/www/wwwroot/deadsec.apiprs.my.id/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
