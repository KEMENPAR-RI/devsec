; Queue workers for the monitoring security (supervisor) - two programs:
;   security-worker       -> checks-high,checks,default (uptime + mail notifications)
;   security-worker-scans -> scans (judol crawls, ScanWebsiteForJudolJob::$timeout=300)
;
; Use this when the server runs supervisor rather than systemd (aaPanel
; Supervisor plugin, cPanel/Plesk). See deploy/security-worker*.service for the
; systemd form; install only one of the two forms, never both, or every job runs twice.
;
; Install (plain supervisor):
;   sudo cp deploy/security-worker.supervisor.conf /etc/supervisor/conf.d/security-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status
;
; aaPanel Supervisor plugin: add one daemon per program below, copying
; command / directory / user into the form fields.
;
; Adjust the PHP path (ls /www/server/php/), directory and user to match the server.
; --timeout must stay below DB_QUEUE_RETRY_AFTER (320).

[program:security-worker]

process_name=%(program_name)s_%(process_num)02d
command=/www/server/php/84/bin/php artisan queue:work database --queue=checks-high,checks,default --sleep=3 --tries=1 --timeout=150 --max-time=3600 --memory=128 --max-jobs=500
directory=/www/wwwroot/deadsec.apiprs.my.id
autostart=true
autorestart=true

user=www

numprocs=1

stopwaitsecs=180
stopasgroup=true
killasgroup=true

redirect_stderr=true

stdout_logfile=/www/wwwroot/deadsec.apiprs.my.id/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:security-worker-scans]

process_name=%(program_name)s_%(process_num)02d
command=/www/server/php/84/bin/php artisan queue:work database --queue=scans --sleep=5 --tries=1 --timeout=300 --max-time=3600 --memory=128 --max-jobs=100
directory=/www/wwwroot/deadsec.apiprs.my.id
autostart=true
autorestart=true

user=www

numprocs=1

stopwaitsecs=330
stopasgroup=true
killasgroup=true

redirect_stderr=true

stdout_logfile=/www/wwwroot/deadsec.apiprs.my.id/storage/logs/worker-scans.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
